<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guestbook</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .message { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .message strong { color: #0056b3; }
        form { margin-bottom: 2em; }
        input, textarea { width: 300px; margin-bottom: 10px; padding: 5px; }
    </style>
</head>
<body>
    <h1>Guestbook</h1>

    <form action="/" method="POST">
        <div>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required>
        </div>
        <div>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" required></textarea>
        </div>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>

    <hr>
    <h2>Messages</h2>

    {{range .}}
        <div class="message">
            <p><strong>{{.Name}} said:</strong></p>
            <p>{{.Message}}</p>
        </div>
    {{else}}
        <p>No messages have been left yet. Be the first to sign the guestbook!</p>
    {{end}}

</body>
</html>
